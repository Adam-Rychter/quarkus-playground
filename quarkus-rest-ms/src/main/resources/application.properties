quarkus.http.host=0.0.0.0

# Allow accessing Dev UI from container network / external hosts and origins
quarkus.dev-ui.hosts=.*
quarkus.dev-ui.cors.enabled=false

# ==========================================
# Database Configuration (PostgreSQL)
# ==========================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:host.containers.internal}:5432/quarkus_db
quarkus.datasource.username=quarkus
quarkus.datasource.password=quarkus

# Schema management for development (modern non-deprecated property)
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=true

# ==========================================
# Connection Pool Management (Agroal)
# ==========================================
# Sizing
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.initial-size=5

# Acquisition Timeout (Prevents threads from blocking indefinitely when pool is busy)
quarkus.datasource.jdbc.acquisition-timeout=5s

# Idle & Lifetime management
quarkus.datasource.jdbc.idle-removal-interval=5m
quarkus.datasource.jdbc.max-lifetime=15m

# Connection Validation (Ensures stale/broken connections are evicted)
quarkus.datasource.jdbc.background-validation-interval=2m

# Corporate Safety: Connection Leak Detection (Logs warning if connection held > 10s)
quarkus.datasource.jdbc.leak-detection-interval=10s

# ==========================================
# Transaction Management (Narayana JTA)
# ==========================================
# Abort and release connection if any transaction exceeds 30 seconds
quarkus.transaction-manager.default-transaction-timeout=30s

# ==========================================
# Observability (Micrometer + Prometheus) -> /q/metrics
# ==========================================
quarkus.datasource.metrics.enabled=true

# ==========================================
# Production / load-test profile (%prod)
# ==========================================
# SQL logging distorts latency and throughput measurements
%prod.quarkus.hibernate-orm.log.sql=false
# Pool sizing can be overridden per run: QUARKUS_DATASOURCE_JDBC_MAX_SIZE=5
